<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="grad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="100%" stop-color="#00000" />
    </linearGradient>

    <!-- subtle dot pattern similar to page backgrounds -->
    <pattern id="dots" patternUnits="userSpaceOnUse" width="20" height="20">
      <circle cx="2" cy="2" r="1" fill="rgba(255,255,255,0.01)" />
    </pattern>

    <style>
      .title { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 82px; fill: #f8fafc; font-weight: 700; }
      .subtitle { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 32px; fill: #e2e8f0; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#grad)" />
  <rect width="1200" height="630" fill="url(#dots)" />

  <text x="50%" y="45%" text-anchor="middle" class="title">Rodrigo Jose</text>  <text x="50%" y="60%" text-anchor="middle" class="subtitle">Software Developer</text>

</svg>